spring:
  config:
    activate:
      on-profile: test

management:
  health:
    elasticsearch:
      enabled: false
  metrics:
    enable:
      process: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  tomcat:
    mbeanregistry:
      enabled: true

