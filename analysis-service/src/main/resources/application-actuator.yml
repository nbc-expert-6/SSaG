    activate:
      on-profile: docker

management:
  metrics:
    enable:
      process: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  tomcat:
    mbeanregistry:
      enabled: true