spring:
  config:
    activate:
      on-profile: actuator

management:
  endpoints:
    web:
      base-path: /products/actuator
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true