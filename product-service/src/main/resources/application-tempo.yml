
spring:
  config:
    activate:
      on-profile: test

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # test 환경: 100% 샘플링
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 10s
      compression: gzip

---

spring:
  config:
    activate:
      on-profile: local

management:
  tracing:
    enabled: true
    sampling:
      probability: 0.1  # local 환경: 100% 샘플링
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 10s
      compression: gzip

---

spring:
  config:
    activate:
      on-profile: dev

management:
  tracing:
    enabled: true
    sampling:
      probability: 0.5  # dev 환경: 50% 샘플링
  otlp:
    tracing:
      endpoint: ${TEMPO_ENDPOINT:http://tempo:4318/v1/traces}
      timeout: 10s
      compression: gzip