<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSaGnawa - 패션 가격비교</title>
    <link rel="stylesheet" href="/css/product-list.css">
</head>
<body>
<!-- 헤더 -->
<header class="header">
    <div class="header-container">
        <div class="logo-section">
            <div class="logo">SSaGnawa</div>
        </div>

        <!-- 검색바 -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="맨투맨">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            </button>
            <button class="search-btn" onclick="searchProducts()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- 메인 컨텐츠 -->
<div class="main-container">
    <!-- 필터 섹션 -->
    <div class="filter-section">
        <!-- 결과 카운트 및 뷰 옵션 -->
        <div class="filter-header">
            <div class="filter-tabs">
                <button class="tab-btn active">전체 <span id="totalCount">(5,681,930)</span></button>
                <button class="tab-btn">가격비교 (73,893)</button>
                <button class="tab-btn">검색 상품 (6,693,735)</button>
            </div>

            <div class="header-controls">
                <button class="sort-selector">
                    소핑몰 선택 ▼
                </button>
                <input type="text" class="list-search" placeholder="리스트 내 검색">
                <button class="result-sort">결과 내 검색 ▼</button>
                <div class="view-toggle">
                    <button class="view-icon active" onclick="changeView('list')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="3" y="4" width="18" height="3"/>
                            <rect x="3" y="10" width="18" height="3"/>
                            <rect x="3" y="16" width="18" height="3"/>
                        </svg>
                    </button>
                    <button class="view-icon" onclick="changeView('grid')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="3" y="3" width="8" height="8"/>
                            <rect x="13" y="3" width="8" height="8"/>
                            <rect x="3" y="13" width="8" height="8"/>
                            <rect x="13" y="13" width="8" height="8"/>
                        </svg>
                    </button>
                </div>
                <select class="page-size" id="pageSizeSelect" onchange="changePageSize()">
                    <option value="30" selected>40개</option>
                    <option value="60">60개</option>
                    <option value="90">90개</option>
                </select>
            </div>
        </div>

        <!-- 정렬 옵션 -->
        <div class="sort-options">
            <div class="sort-left">
                <button class="sort-btn active" data-sort="POPULAR" onclick="changeSortType(this)">
                    <span class="check">✓</span> 인기상품순
                </button>
                <button class="sort-btn" data-sort="PRICE_LOW" onclick="changeSortType(this)">
                    <span class="check">✓</span> 낮은가격순
                </button>
                <button class="sort-btn" data-sort="PRICE_HIGH" onclick="changeSortType(this)">
                    <span class="check">✓</span> 높은가격순
                </button>
                <button class="sort-btn" data-sort="LATEST" onclick="changeSortType(this)">
                    <span class="check">✓</span> 신상품순
                </button>
                <button class="sort-btn" data-sort="REVIEW_COUNT" onclick="changeSortType(this)">
                    <span class="check">✓</span> 상품평 많은순
                </button>
                <button class="sort-btn" data-sort="RATING" onclick="changeSortType(this)">
                    <span class="check">✓</span> 최신순
                </button>
            </div>

            <div class="sort-right">
                <label class="shipping-toggle">
                    배송비포함
                    <input type="checkbox" id="shippingToggle" onchange="toggleShipping()">
                    <span class="toggle-box"></span>
                    <span class="toggle-text">OFF</span>
                </label>
            </div>
        </div>
    </div>

    <!-- 상품 목록 -->
    <div class="product-list" id="productList">
        <!-- 상품 아이템들이 여기에 동적으로 추가됩니다 -->
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination" id="pagination">
        <!-- 페이지 버튼들이 여기에 동적으로 추가됩니다 -->
    </div>
</div>

<script src="/js/product-list.js"></script>
<script src="/js/event.js"></script>
</body>
</html>
