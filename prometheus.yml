global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:

rule_files:

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]
        labels:
          app: "prometheus"

  - job_name: "analysis-service"
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: [ 'host.docker.internal:8082' ]

  - job_name: "url-parser"
    metrics_path: /metrics
    static_configs:
      - targets:
          - auction-url-parser:8000
          - coupang-url-parser:8000
          - elevenst-url-parser:8000
          - gmarket-url-parser:8000
        labels:
          parser_type: "url"

  - job_name: "detail-parser"
    metrics_path: /metrics
    static_configs:
      - targets:
          - auction-detail-parser:8000
          - coupang-detail-parser:8000
          - elevenst-detail-parser:8000
          - gmarket-detail-parser:8000
        labels:
          parser_type: "detail"

  - job_name: "review-parser"
    metrics_path: /metrics
    static_configs:
      - targets:
          - auction-review-parser:8000
          - coupang-review-parser:8000
          - elevenst-review-parser:8000
          - gmarket-review-parser:8000
        labels:
          parser_type: "review"
