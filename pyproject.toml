[tool.isort]
profile = "black"

# 로컬 패키지(내부 패키지)
known_first_party = ["crawler", "common"]

# import 그룹 순서 설정
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER"
]

# 섹션별 정렬
force_sort_within_sections = true
force_single_line = false
force_alphabetical_sort = true

# 줄 사이 공백 설정
lines_between_sections = 1
