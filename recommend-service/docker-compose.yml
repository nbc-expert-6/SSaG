services:
  recommend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommend-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RDS_HOST: ssag-database.cnkkgqgcc71r.ap-northeast-2.rds.amazonaws.com
      RDS_PORT: 5432
      RDS_DB_NAME: recommend_service_db
      RDS_USERNAME: postgres
      RDS_PASSWORD: qwer1234!

      TZ: "Asia/Seoul"
    volumes:
      - ./logs:/app/logs
      - ./src/main/resources/vector:/app/vector
    restart: unless-stopped
    networks:
      - infra

networks:
  infra:
    external: true