services:
  auction-review-parser:
    image: auction-review-parser:latest
    container_name: auction-review-parser
    env_file:
      - .env
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  coupang-review-parser:
    image: coupang-review-parser:latest
    container_name: coupang-review-parser
    env_file:
      - .env
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  elevenst-review-parser:
    image: elevenst-review-parser:latest
    container_name: elevenst-review-parser
    env_file:
      - .env
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  gmarket-review-parser:
    image: gmarket-review-parser:latest
    container_name: gmarket-review-parser
    env_file:
      - .env
    networks:
      - infra
    tmpfs:
      - /tmp:exec

networks:
  infra:
    external: true
