services:
  auction-review-parser:
    image: review-parser:latest
    container_name: auction-review-parser
    env_file:
      - .env
    environment:
      PLATFORM: Auction
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  coupang-review-parser:
    image: review-parser:latest
    container_name: coupang-review-parser
    env_file:
      - .env
    environment:
      PLATFORM: Coupang
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  elevenst-review-parser:
    image: review-parser:latest
    container_name: elevenst-review-parser
    env_file:
      - .env
    environment:
      PLATFORM: Elevenst
    networks:
      - infra
    tmpfs:
      - /tmp:exec

  gmarket-review-parser:
    image: review-parser:latest
    container_name: gmarket-review-parser
    env_file:
      - .env
    environment:
      PLATFORM: Gmarket
    networks:
      - infra
    tmpfs:
      - /tmp:exec

networks:
  infra:
    external: true
