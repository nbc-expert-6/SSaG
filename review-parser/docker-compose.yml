services:
  auction-url-parser:
    image: auction-review-parser:latest
    container_name: auction-review-parser
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:qwer1234!@postgres:5432/product_service_db"
      KAFKA_BOOTSTRAP: "kafka:9092"
    networks:
      - infra

  coupang-url-parser:
